<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Meta viewport ini wajib agar web-mu tidak mengecil saat dibuka di HP -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Aplikasi</title>
    <style>
        /* Menghilangkan pinggiran putih dan membuat iframe full screen */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #f4f5f7; /* Warna dasar abu-abu elegan */
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- GANTI LINK DI BAWAH DENGAN LINK GOOGLE APPS SCRIPT-MU -->
    <iframe src="https://script.google.com/macros/s/AKfycbwXeXSFaI06HAwY3zMczPjMoYOZrYMU6WXptnghsYC7n96ieIQH72jNNykw9X8abqT2/exec"></iframe>

</body>
</html>
